<!DOCTYPE html>
<h1>Hello Git</h1>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef2ff, #dbeafe);
        font-family: Arial, sans-serif;
      }

      .login-card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        padding: 32px 28px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      }

      h2 {
        margin: 0 0 24px;
        text-align: center;
        color: #1f2937;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-size: 0.95rem;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 18px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 1rem;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .row label {
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .row a {
        color: #2563eb;
        text-decoration: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
      }

      .signup {
        text-align: center;
        margin-top: 18px;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .signup a {
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <form class="login-card">
      <h2>Login</h2>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter your username" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" />

      <div class="row">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign In</button>

      <div class="signup">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </form>
  </body>
</html>
